  <body id="login-page">
    <div class="fixed_navbar">
      <left>

          <img
            src="Our_logo-removebg-preview.png"
            alt="Error"
            id="img1"
            style="filter: brightness(50%)" />
        </a>
      </left>
      <div class="div-NB">
        <a
          href="Product_page_1.html"
          style="text-decoration: none; color: black">
          <h2 id="div-LP-NB">Thick-crust</h2></a
        >

        <a
          href="Product_page_3.html"
          style="text-decoration: none; color: black">
          <h2 id="div-LP-NB_1">Thin-crust</h2>
        </a>

        <a
          href="Product_page_2.html"
          style="text-decoration: none; color: black">
          <h2 id="div-LP-NB_2">Vegetarian options</h2>
        </a>
        <a href="Hot_deals.html" style="text-decoration: none; color: black">
          <h2 id="div-LP-NB_2">Hot deals</h2>
        </a>

          <i class="fa-solid fa-cart-shopping fa-xl" id="font_awesome_NB"></i>

        <a href="Login_HTML-page.html" target="_blank"> </a>

    </div>

    <br /><br /><br /><br /><br /><br /><br /><br />
    <div id="positioning_div">
      <div class="Log-P_div-1" id="Main_log-P">
        <form class="login-form">
          <h2>Login</h2>
          <div class="input-group">
            <label for="username"></label>
            <input
              type="text"
              id="username"
              name="username"
              required
              class="username"
              placeholder="User-name" />
          </div>
          <div class="input-group">
            <label for="password"></label>
            <input
              type="password"
              id="password"
              name="password"
              required
              class="username"
              placeholder="Password" />
          </div>
          <button type="submit" id="button_for_login">Login</button>
          <br /><br /><br />
          <p class="signup-link">
            Don't have an account? <a href="#">Sign up</a>
          </p>
        </form>
      </div>
    </div>
  </body>
