  <body id="login-page">
    <div class="fixed_navbar">
      <left>
        <a href="Main_HTML-page.html">
          <img src="Our_logo-removebg-preview.png" alt="Error" id="img1" />
        </a>
      </left>
      <div class="div-NB">
        <a
          href="Product_page_1.html"
          style="text-decoration: none; color: black">
          <h2 id="div-LP-NB">Thick-crust</h2></a
        >
        <a
          href="Product_page_3.html"
          style="text-decoration: none; color: black">
          <h2 id="div-LP-NB_1">Thin-crust</h2>
        </a>

        <a
          href="Product_page_2.html"
          style="text-decoration: none; color: black">
          <h2 id="div-LP-NB_2">Vegetarian options</h2>
        </a>
        <a href="Hot_deals.html" style="text-decoration: none; color: black">
          <h2 id="div-LP-NB_2">Hot deals</h2>
        </a>
        <i class="fa-solid fa-cart-shopping fa-xl" id="font_awesome_NB"></i>
        <a href="Login_HTML-page.html">

        </a>
      </div>
    </div>

    <br /><br /><br /><br /><br /><br /><br />
    <br /><br />

    <div id="div_to_position_div">
      <div
        id="Div_positioning_items_bar"
        style="background: linear-gradient(to right, #ff4e00, #8fbc8f)">
        <h1
          style="
            font-family:cursive;
              background: white;
              border-radius: 10px;
              padding: 5px 20px;
          ">
          My Shopping cart
        </h1>
        <div class="items" id="item1">
          <img src="istockphoto-180822661-612x612.jpg" id="img1Cart" />
          <h1 id="h1cart" style="font-family: cursive">Margharita Pizza</h1>
          <form>
            <input type="radio" name="Chocolate" value="JavaScript" /> Stockholm
            <input type="radio" name="vanilla" value="python" /> Huddinge
            <input type="radio" name="strawberry" value="JavaScript" /> Tullinge
            <input type="radio" name="mint" value="JavaScriptMint" /> Tumba

            <br /><br />

            <h2 style="font-size: 19px; font-family: cursive">
              Please select the size
            </h2>
            <select name="icecream" id="select_id">
              <option value="vanilla">9-inch</option>
              <option value="chocolate">10-inch</option>
              <option value="strawberry">11-inch</option>
              <option value="mint">12 inch</option>
            </select>
          </form>
        </div>
        <div class="items" id="item2">
          <img src="pepp.jpg" id="img1Cart" />
          <h1 id="h1cart" style="font-family: cursive">Pepporoni Pizza</h1>
          <form>
            <input type="radio" name="Chocolate" value="JavaScript" /> Stockholm
            <input type="radio" name="vanilla" value="python" /> Huddinge
            <input type="radio" name="strawberry" value="JavaScript" /> Tullinge
            <input type="radio" name="mint" value="JavaScriptMint" /> Tumba

            <br /><br />

            <h2 style="font-size: 19px; font-family: cursive">
              Please select the size
            </h2>
            <select name="icecream" id="select_id">
              <option value="vanilla">9-inch</option>
              <option value="chocolate">10-inch</option>
              <option value="strawberry">11-inch</option>
              <option value="mint">12 inch</option>
            </select>
          </form>
        </div>
      </div>

      <div id="Div_positioning_checkout_bar">
        <div class="items" id="part1" style="background-color: white">
          <h1 style="font-family: cursive">Order Summary</h1>
        </div>
        <div class="items" id="part2"></div>
        <div class="items" id="part3" style="background-color: white">
          <div id="centerbutton">
            <button id="Checkout_button">Checkout</button>
          </div>
        </div>
      </div>
    </div>
